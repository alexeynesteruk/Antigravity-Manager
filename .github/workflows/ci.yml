name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  validate:
    name: Validate Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Verify CI helpers with built-in Node.js tests
        run: node --test scripts/ci/helpers.test.mjs
      - name: Select validation scope
        id: changes
        run: node scripts/ci/changes.mjs
      - name: Set up Node.js
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked frontend dependencies
        if: steps.changes.outputs.frontend == 'true'
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund
      - name: Type-check and build frontend once
        if: steps.changes.outputs.frontend == 'true'
        run: npm run build
      - name: Install Linux development dependencies
        if: steps.changes.outputs.backend == 'true'
        run: bash scripts/ci/install-linux-deps.sh
      - name: Set up Rust
        if: steps.changes.outputs.backend == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        if: steps.changes.outputs.backend == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: linux-validation
          save-if: ${{ github.event_name == 'push' }}
      - name: Provide assets for backend-only validation
        if: steps.changes.outputs.backend == 'true' && steps.changes.outputs.frontend != 'true'
        run: |
          mkdir -p dist
          printf '<!doctype html><title>CI compile placeholder</title>\n' > dist/index.html
      - name: Check Rust formatting
        if: steps.changes.outputs.backend == 'true'
        working-directory: src-tauri
        run: cargo fmt -- --check
      - name: Lint Rust and compile all test targets without running them
        if: steps.changes.outputs.backend == 'true'
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --all-features
      - name: Summarize validation
        if: always()
        env:
          FRONTEND: ${{ steps.changes.outputs.frontend }}
          BACKEND: ${{ steps.changes.outputs.backend }}
        run: |
          {
            echo '### Routine validation'
            echo "Frontend selected: ${FRONTEND:-not resolved}"
            echo "Backend selected: ${BACKEND:-not resolved}"
            echo 'Rust test targets are compiled, not executed. Native packages and Docker images require manual opt-in.'
          } >> "$GITHUB_STEP_SUMMARY"
