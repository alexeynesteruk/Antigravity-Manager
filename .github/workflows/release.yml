name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag; dispatch from its main/beta channel or select the tag'
        type: string
        default: ''
      build_native:
        description: 'Build all six native platform artifacts (expensive)'
        type: boolean
        default: false
      publish_release:
        description: 'Publish complete signed native artifacts; requires build_native and signing key'
        type: boolean
        default: false
      build_docker:
        description: 'Build amd64 and arm64 Docker images (expensive)'
        type: boolean
        default: false
      publish_docker:
        description: 'Push Docker images and manifest; requires build_docker and Docker Hub secrets'
        type: boolean
        default: false

permissions:
  contents: read

# Serialize publication of the stable and preview update channels.
concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  gate:
    name: Validate release tag (no packaging by default)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.gate.outputs.release_tag }}
      commit: ${{ steps.gate.outputs.commit }}
      is_prerelease: ${{ steps.gate.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Require workflow helpers in the selected release tag
        run: |
          test -f scripts/ci/release.mjs || { echo '::error::Selected tag predates the manual release helpers. Select a tag containing this CI update.'; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify existing tag, channel, versions and release notes
        id: gate
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_NATIVE: ${{ inputs.build_native || false }}
          PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
          BUILD_DOCKER: ${{ inputs.build_docker || false }}
          PUBLISH_DOCKER: ${{ inputs.publish_docker || false }}
        run: node scripts/ci/release.mjs gate

  native:
    name: Package ${{ matrix.target }} (manual)
    needs: gate
    if: github.event_name == 'workflow_dispatch' && inputs.build_native
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: darwin-aarch64
            rust_target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - runner: macos-latest
            target: darwin-x86_64
            rust_target: x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - runner: macos-latest
            target: darwin-universal
            rust_target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: linux-x86_64
            rust_target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            rust_target: aarch64-unknown-linux-gnu
            rust_targets: aarch64-unknown-linux-gnu
          - runner: windows-2025
            target: windows-x86_64
            rust_target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund
      - name: Install Linux packaging dependencies
        if: startsWith(matrix.runner, 'ubuntu-')
        run: bash scripts/ci/install-linux-deps.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: package-${{ matrix.target }}
      - name: Configure signing and avoid building frontend twice
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const signed = Boolean(process.env.TAURI_SIGNING_PRIVATE_KEY?.trim());
          if (process.env.PUBLISH_RELEASE === 'true' && !signed) throw new Error('Publication requires the updater signing key');
          writeFileSync(`${process.env.RUNNER_TEMP}/tauri-ci.json`, JSON.stringify({ build: { beforeBuildCommand: '' }, bundle: { createUpdaterArtifacts: signed } }));
          NODE
      - name: Build frontend once
        run: npm run build
      - name: Clear old cached installer versions for this target
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: node scripts/ci/release.mjs clean-bundle
      - name: Build universal secondary binary
        if: matrix.target == 'darwin-universal'
        run: |
          cargo build --locked --release --target aarch64-apple-darwin --bin antigravity-server --manifest-path src-tauri/Cargo.toml
          cargo build --locked --release --target x86_64-apple-darwin --bin antigravity-server --manifest-path src-tauri/Cargo.toml
          mkdir -p src-tauri/target/universal-apple-darwin/release
          lipo -create -output src-tauri/target/universal-apple-darwin/release/antigravity-server \
            src-tauri/target/aarch64-apple-darwin/release/antigravity-server \
            src-tauri/target/x86_64-apple-darwin/release/antigravity-server
      - name: Package app with locked Rust dependencies
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          ARTIFACT_TARGET: ${{ matrix.target }}
          IS_PRERELEASE: ${{ needs.gate.outputs.is_prerelease }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args=(--ci --config "$RUNNER_TEMP/tauri-ci.json" --target "$RUST_TARGET")
          if [[ "$ARTIFACT_TARGET" == darwin-universal ]]; then args+=(--bundles app); fi
          if [[ "$ARTIFACT_TARGET" == windows-x86_64 && "$IS_PRERELEASE" == true ]]; then args+=(--bundles nsis); fi
          npm run tauri build -- "${args[@]}" -- --locked
      - name: Collect immutable installer bytes and provenance
        env:
          ARTIFACT_TARGET: ${{ matrix.target }}
          RUST_TARGET: ${{ matrix.rust_target }}
          RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
        run: node scripts/ci/release.mjs stage
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish complete signed native release (manual)
    needs: [gate, native]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: all-artifacts
      - name: Verify complete target set and checksums; require updater signatures
        env:
          RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
        run: node scripts/ci/release.mjs prepare
      - name: Upload to draft then publish and advance correct update channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
        run: node scripts/ci/release.mjs publish

  docker:
    name: Docker ${{ matrix.arch }} (manual)
    needs: gate
    if: github.event_name == 'workflow_dispatch' && inputs.build_docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.commit }}
      - name: Resolve Docker repository
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "repository=${OWNER,,}/antigravity-manager" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: inputs.publish_docker
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image, optionally push versioned architecture tag
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: USE_MIRROR=false
          push: ${{ inputs.publish_docker }}
          tags: ${{ steps.image.outputs.repository }}:${{ needs.gate.outputs.release_tag }}-${{ matrix.arch }}
          outputs: ${{ !inputs.publish_docker && format('type=oci,dest={0}/image-{1}.tar', runner.temp, matrix.arch) || '' }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        if: '!inputs.publish_docker'
        with:
          name: docker-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  docker-manifest:
    name: Publish Docker manifest after both architectures succeed (manual)
    needs: [gate, docker]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_docker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish version manifest; stable alone advances latest
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ needs.gate.outputs.release_tag }}
          IS_PRERELEASE: ${{ needs.gate.outputs.is_prerelease }}
        run: |
          image="${OWNER,,}/antigravity-manager"
          docker buildx imagetools create --tag "$image:$TAG" "$image:$TAG-amd64" "$image:$TAG-arm64"
          if [[ "$IS_PRERELEASE" == false ]]; then
            docker buildx imagetools create --tag "$image:latest" "$image:$TAG"
            docker buildx imagetools create --tag "$image:latest-amd64" "$image:$TAG-amd64"
            docker buildx imagetools create --tag "$image:latest-arm64" "$image:$TAG-arm64"
          fi
