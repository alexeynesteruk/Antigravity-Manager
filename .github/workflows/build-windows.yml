name: Build Windows Executable (manual)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Attach installer to a DRAFT release only; full public releases use Release workflow'
        type: boolean
        default: false
      release_tag:
        description: 'Existing version tag (required for a release draft); otherwise build selected branch'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ inputs.create_release && 'release-publication' || format('windows-{0}', inputs.release_tag || github.ref) }}
  cancel-in-progress: ${{ !inputs.create_release }}

jobs:
  windows:
    name: Build Windows NSIS installer
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Resolve artifact version; gate optional release draft
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CREATE_RELEASE: ${{ inputs.create_release }}
        run: |
          test -f scripts/ci/release.mjs || { echo '::error::Selected ref predates the manual build helpers. Select a ref containing this CI update.'; exit 1; }
          if [[ "$CREATE_RELEASE" == true ]]; then
            if [[ -z "$RELEASE_TAG" ]]; then echo 'A release draft requires an existing release_tag'; exit 1; fi
            node scripts/ci/release.mjs gate
          else
            node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          appendFileSync(process.env.GITHUB_OUTPUT, `release_tag=v${version}\ncommit=${commit}\n`);
          NODE
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: package-windows-x86_64
      - name: Install locked frontend dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund
      - name: Configure artifact signing and build frontend once
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync(`${process.env.RUNNER_TEMP}/tauri-ci.json`, JSON.stringify({ build: { beforeBuildCommand: '' }, bundle: { createUpdaterArtifacts: Boolean(process.env.TAURI_SIGNING_PRIVATE_KEY?.trim()) } }));
          NODE
          npm run build
      - name: Build Windows installer with locked Rust dependencies
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          RUST_TARGET=x86_64-pc-windows-msvc node scripts/ci/release.mjs clean-bundle
          npm run tauri build -- --ci --config "$RUNNER_TEMP/tauri-ci.json" --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: Stage installer without changing signed bytes
        env:
          ARTIFACT_TARGET: windows-x86_64
          RUST_TARGET: x86_64-pc-windows-msvc
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
        run: node scripts/ci/release.mjs stage
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  draft:
    name: Attach Windows installer to unpublished draft
    needs: windows
    if: inputs.create_release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.windows.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: windows-artifacts
      - name: Create or update draft with current changelog; never publish partial release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.windows.outputs.release_tag }}
        run: node scripts/ci/release.mjs windows-draft
