services:
  antigravity-manager:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: lbjlaq/antigravity-manager
    container_name: antigravity-manager
    network_mode: host  # Use the host network so localhost:8045 is directly reachable
    # ports:  # Port mapping is not needed in host mode
    #   - "8045:8045"
    volumes:
      - ~/.antigravity_tools:/root/.antigravity_tools
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - API_KEY=${API_KEY:-test}  # [Important] Set your own secret key; if not set, check the logs for a randomly generated one
      - ABV_BIND_LOCAL_ONLY=${ABV_BIND_LOCAL_ONLY:-true}  # Bind to 127.0.0.1 only
    restart: unless-stopped
